<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="../../../images/favicon.png">
<title>Functions That Feed Each Other</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
  :root{
    --tib-primary-color:#00e5ff;
    --tib-primary-dark:#0099cc;
    --tib-secondary-color:#b0b0b0;
    --tib-bg-color:#0a0a0a;
    --tib-bg-gradient-end:#1a1a2e;
    --tib-surface-color:#1a1a1a;
    --tib-surface-alt:#0f0f0f;
    --tib-surface-light:#2a2a2a;
    --tib-text-color:#ffffff;
    --tib-text-muted:#8a8a8a;
    --tib-border-subtle:rgba(255,255,255,0.08);
    --tib-primary-alpha-10:rgba(0,229,255,0.1);
    --tib-primary-alpha-30:rgba(0,229,255,0.3);
    --tib-primary-alpha-03:rgba(0,229,255,0.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--tib-bg-color);}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--tib-text-color);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #deck{
    position:relative;
    width:100vw;height:100vh;
    background:radial-gradient(ellipse at top right, var(--tib-bg-gradient-end) 0%, var(--tib-bg-color) 60%);
  }
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:48px 72px 40px;
    overflow:hidden;
  }
  .slide.active{display:flex;}
  .slide > *{margin:0;}
  .slide > h1{padding:0.18em 0; margin:-0.18em 0 8px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--tib-primary-color); font-weight:600;
    margin-bottom:14px;
  }
  h1{
    font-size:46px; font-weight:800; line-height:1.08; letter-spacing:-0.01em;
    background-image:linear-gradient(100deg, var(--tib-text-color) 0%, var(--tib-primary-color) 62%, var(--tib-primary-dark) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    max-width:900px;
  }
  h2{font-size:30px; font-weight:700; margin-bottom:16px; color:var(--tib-text-color);}
  h3{font-size:20px; font-weight:600; color:var(--tib-primary-color); margin-bottom:10px;}
  p{font-size:18px; line-height:1.55; color:var(--tib-text-color);}
  .muted{color:var(--tib-secondary-color);}
  .content{flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; overflow:auto; padding-right:4px;}

  .card{
    background:var(--tib-surface-color);
    border:1px solid var(--tib-border-subtle);
    border-radius:20px;
    padding:22px 26px;
  }
  .card.step{background:var(--tib-surface-alt);}
  .math.result{
    background:var(--tib-primary-alpha-10);
    border:1px solid var(--tib-primary-alpha-30);
    border-radius:20px;
    padding:18px 24px;
    font-family:'JetBrains Mono',monospace;
    font-size:22px; font-weight:600; color:var(--tib-primary-color);
  }
  .step-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--tib-primary-alpha-10); color:var(--tib-primary-color);
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    margin-right:10px; flex-shrink:0;
  }
  .step-row{display:flex; align-items:flex-start; gap:6px;}

  .frag{opacity:0; transform:translateY(6px); transition:opacity .35s ease, transform .35s ease; visibility:hidden;}
  .slide.active .frag.on{opacity:1; transform:translateY(0); visibility:visible;}

  .slide.duo{padding:36px 64px 24px;}
  .slide.duo .eyebrow{margin-bottom:8px;}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .slide.duo h2{font-size:24px; margin-bottom:10px;}
  .slide.duo .content{gap:8px;}
  .slide.duo .card{padding:12px 16px;}
  .slide.duo h3{font-size:17px; margin-bottom:6px;}
  .slide.duo p{font-size:14px; line-height:1.4; margin-top:6px;}
  .slide.duo .math.result{font-size:17px; padding:10px 14px; margin-bottom:6px;}
  .slide.duo .rule-banner{padding:10px 16px; font-size:14px; margin-top:0;}

  .rule-banner{
    margin-top:auto;
    background:linear-gradient(120deg, var(--tib-primary-alpha-10), transparent);
    border:1px solid var(--tib-primary-alpha-30);
    border-radius:20px;
    padding:16px 22px;
    font-size:17px;
  }
  .rule-banner b{color:var(--tib-primary-color);}

  .example-fn{
    display:flex; gap:24px; flex-wrap:wrap; margin-bottom:4px;
  }
  .fn-pill{
    font-family:'JetBrains Mono',monospace; font-size:16px;
    background:var(--tib-surface-light); border-radius:50px; padding:8px 18px;
    color:var(--tib-text-color);
  }
  .fn-pill b{color:var(--tib-primary-color);}

  .practice-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .practice-q{
    background:var(--tib-surface-color); border:1px solid var(--tib-border-subtle);
    border-radius:20px; padding:16px 18px; cursor:pointer; transition:border-color .2s;
  }
  .practice-q:hover{border-color:var(--tib-primary-alpha-30);}
  .practice-q .qtext{font-size:16px; margin-bottom:8px;}
  .practice-q .qtext .mono{font-size:15px;}
  .practice-q .ans{
    display:none; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--tib-border-subtle);
    font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--tib-primary-color);
  }
  .practice-q.open .ans{display:block;}
  .practice-q .tap-hint{font-size:12px; color:var(--tib-text-muted); font-family:'JetBrains Mono',monospace;}

  .widget{
    background:var(--tib-surface-alt); border:1px solid var(--tib-border-subtle);
    border-radius:20px; padding:20px 24px; display:flex; gap:24px; align-items:center;
  }
  .widget .controls{width:260px; flex-shrink:0;}
  .widget input[type=range]{width:100%; accent-color:var(--tib-primary-color);}
  .widget .readout{font-family:'JetBrains Mono',monospace; font-size:15px; margin:6px 0;}
  .widget .verdict{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px;
    padding:10px 16px; border-radius:12px; margin-top:10px;
    transition:background .2s, color .2s;
  }
  .verdict.fail{background:rgba(255,90,90,0.14); color:#ff8080;}
  .verdict.pass{background:rgba(70,220,140,0.14); color:#5ee6a6;}
  .widget svg{background:var(--tib-surface-color); border-radius:14px;}

  .hud{
    position:fixed; bottom:18px; right:24px; display:flex; gap:10px; z-index:50;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--tib-text-muted);
  }
  .hud .pill{background:var(--tib-surface-light); padding:6px 12px; border-radius:50px;}
  #progress{
    position:fixed; top:0; left:0; height:3px; background:var(--tib-primary-color);
    transition:width .3s ease; z-index:60;
  }
  #timer{position:fixed; top:16px; right:24px; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--tib-text-muted); z-index:50;}
  #timer.warn{color:#ff8080;}

  #board{position:fixed; inset:0; background:#050505; z-index:80; display:none;}
  #board.on{display:block;}
  #board canvas{width:100%; height:100%; display:block; cursor:crosshair;}
  #board .hint{position:fixed; top:16px; left:24px; color:var(--tib-text-muted); font-family:'JetBrains Mono',monospace; font-size:13px;}

  #overview{position:fixed; inset:0; background:rgba(5,5,5,0.96); z-index:90; display:none; overflow:auto; padding:48px;}
  #overview.on{display:block;}
  .ov-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; max-width:1200px; margin:0 auto;}
  .ov-card{
    background:var(--tib-surface-color); border:1px solid var(--tib-border-subtle); border-radius:16px;
    padding:14px; cursor:pointer; aspect-ratio:16/10; display:flex; flex-direction:column; justify-content:space-between;
  }
  .ov-card:hover{border-color:var(--tib-primary-color);}
  .ov-card .n{font-family:'JetBrains Mono',monospace; color:var(--tib-primary-color); font-size:13px;}
  .ov-card .t{font-size:14px; font-weight:600;}

  @media print{
    body{background:#fff; color:#000;}
    .slide{position:relative; display:flex !important; page-break-after:always; height:auto; min-height:100vh;}
    h1{-webkit-background-clip:initial; background-clip:initial; color:#000 !important; background-image:none;}
    .frag{opacity:1 !important; visibility:visible !important; transform:none !important;}
    .hud,#timer,#progress{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .frag{transition:none;}
  }
</style>
<div id="progress"></div>
<div id="timer" class="mono">55:00</div>
<div id="deck"></div>

<div id="board" class="on-off">
  <div class="hint">Blank board: draw with mouse or touch. Press W or Esc to close.</div>
  <canvas id="boardCanvas"></canvas>
</div>

<div id="overview">
  <div class="ov-grid" id="ovGrid"></div>
</div>

<div class="hud">
  <span class="pill" id="slideCounter">1 / 12</span>
  <span class="pill">← → move · Space next · R reveal · O overview · W board · T timer · F fullscreen · ? help</span>
</div>

<script>
const SLIDES = [];
function slide(html, opts={}){ SLIDES.push({html, ...opts}); }

// ---------- Slide 1: Title ----------
slide(`
  <div class="eyebrow">1.2 FUNCTIONS · SESSION 2 OF 5 · 60 MIN</div>
  <h1>Functions That Feed Each Other</h1>
  <div class="content" style="justify-content:center;">
    <p class="muted" style="font-size:20px; max-width:640px;">One function's output becomes another function's input. Get the order wrong, and you get a different answer, every time.</p>
    <div class="frag on" style="margin-top:24px;">
      <div class="fn-pill">Today: <b>composite functions</b> &middot; gf(x) and (f&#8728;g)(x) &middot; when a composite can&rsquo;t be formed</div>
    </div>
  </div>
`, {title:"Title"});

// ---------- Slide 2: Do Now ----------
slide(`
  <div class="eyebrow">DO NOW &middot; 5 MIN</div>
  <h2>Same two functions, two different orders</h2>
  <div class="content">
    <div class="example-fn">
      <div class="fn-pill">f(x) = 2x &minus; 3</div>
      <div class="fn-pill">g(x) = 1 &minus; 2x</div>
      <div class="fn-pill">both x &isin; &Ropf;</div>
    </div>
    <p>Starting from <span class="mono">x = 2</span>:</p>
    <div class="card step">
      <p><b>Row A:</b> work out f first, then feed that result into g.</p>
      <div class="frag" data-frag="1"><p class="mono" style="color:var(--tib-primary-color);">f(2) = 2(2) &minus; 3 = 1 &nbsp;&rarr;&nbsp; g(1) = 1 &minus; 2(1) = <b>&minus;1</b></p></div>
    </div>
    <div class="card step">
      <p><b>Row B:</b> work out g first, then feed that result into f.</p>
      <div class="frag" data-frag="2"><p class="mono" style="color:var(--tib-primary-color);">g(2) = 1 &minus; 2(2) = &minus;3 &nbsp;&rarr;&nbsp; f(&minus;3) = 2(&minus;3) &minus; 3 = <b>&minus;9</b></p></div>
    </div>
    <div class="frag math result" data-frag="3">Two different answers from the same starting number. The order you apply the functions in changes the result.</div>
  </div>
`, {title:"Do Now"});

// ---------- Slide 3: What a composite function is ----------
slide(`
  <div class="eyebrow">1 OF 5 &middot; THE IDEA</div>
  <h2>Feed one function's output into another</h2>
  <div class="content">
    <p>A composite function takes the <b>output</b> of one function and uses it as the <b>input</b> of another. Nothing new is being calculated. You're just chaining two rules you already know.</p>
    <div class="card frag" data-frag="1">
      <h3>Think of an assembly line</h3>
      <p>Station 1 takes a part and does something to it. Station 2 takes whatever comes off station 1 and does something else to it. <b>Swap the order of the stations, and a different product comes off the line</b>, even though both stations do exactly the same job either way.</p>
    </div>
    <div class="card frag math result" data-frag="2">That's exactly what the Do Now just showed with real numbers: f then g gave &minus;1. g then f gave &minus;9. Same two functions, same starting number, different order, different answer.</div>
  </div>
`, {title:"What a composite is"});

// ---------- Slide 4: Two notations (duo) ----------
slide(`
  <div class="eyebrow">2 OF 5 &middot; NOTATION</div>
  <h2>Two ways to write it: you'll see both</h2>
  <div class="content">
    <div class="cols">
      <div class="card">
        <h3>Cambridge exam notation</h3>
        <div class="math result" style="margin-bottom:10px;">gf(x)</div>
        <p>No circle, letters just sit next to each other. <b>f is written right next to x</b>, so f is applied first. Then g is applied to that result.</p>
        <p class="mono" style="color:var(--tib-secondary-color); font-size:15px;">gf(x) = g( f(x) )</p>
      </div>
      <div class="card">
        <h3>Khan Academy notation</h3>
        <div class="math result" style="margin-bottom:10px;">(f&#8728;g)(x)</div>
        <p>Read "f composed with g" or "f of g". <b>g is written right next to x</b> (inside the brackets), so g is applied first. Then f is applied to that result.</p>
        <p class="mono" style="color:var(--tib-secondary-color); font-size:15px;">(f&#8728;g)(x) = f( g(x) )</p>
      </div>
    </div>
    <div class="rule-banner frag" data-frag="1">
      <b>The rule that works for both:</b> find whichever function is written closest to x and do that one first, then apply the other function to the result. Don't just read left to right. In both notations, the function you meet first on the page is applied <i>second</i>.
    </div>
    <div class="frag" data-frag="2" style="font-size:15px; color:var(--tib-secondary-color); margin-top:4px;">On a Cambridge paper, always answer using gf(x) form. That's what the mark scheme expects. If you see the circle notation somewhere else, like on Khan Academy, it means the same idea, applied the same way: closest to x first.</div>
  </div>
`, {title:"Two notations", cls:"duo"});

// ---------- Slide 5: Worked example, symbolic ----------
slide(`
  <div class="eyebrow">3 OF 5 &middot; WORKED EXAMPLE</div>
  <h2>Turn it into a formula that works for any x</h2>
  <div class="content">
    <div class="example-fn">
      <div class="fn-pill">f(x) = 2x &minus; 3</div>
      <div class="fn-pill">g(x) = 1 &minus; 2x</div>
    </div>
    <div class="card step">
      <div class="step-row"><span class="step-num">1</span><p>Find gf(x). Apply f first, but keep it as x. Don't substitute a number yet.</p></div>
      <div class="frag" data-frag="1"><p class="mono">gf(x) = g( f(x) ) = g(2x &minus; 3) = 1 &minus; 2(2x &minus; 3)</p></div>
      <div class="frag math result" data-frag="2">= 1 &minus; 4x + 6 = <b>7 &minus; 4x</b></div>
    </div>
    <div class="card step frag" data-frag="3">
      <div class="step-row"><span class="step-num">2</span><p>Check it against the Do Now: substitute x = 2 into the formula.</p></div>
      <div class="frag math result" data-frag="4">gf(2) = 7 &minus; 4(2) = 7 &minus; 8 = <b>&minus;1</b>, matching Row A exactly.</div>
    </div>
    <div class="card step frag" data-frag="5">
      <div class="step-row"><span class="step-num">3</span><p>Same process for fg(x): apply g first.</p></div>
      <div class="frag" data-frag="6"><p class="mono">fg(x) = f( g(x) ) = f(1 &minus; 2x) = 2(1 &minus; 2x) &minus; 3 = 2 &minus; 4x &minus; 3</p></div>
      <div class="frag math result" data-frag="7">= <b>&minus;4x &minus; 1</b> &nbsp;&rarr;&nbsp; at x = 2: &minus;8 &minus; 1 = <b>&minus;9</b>, matching Row B.</div>
    </div>
  </div>
`, {title:"Worked: symbolic"});

// ---------- Slide 6: The existence condition ----------
slide(`
  <div class="eyebrow">4 OF 5 &middot; THE CONDITION</div>
  <h2>gf can't always be formed</h2>
  <div class="content">
    <div class="card">
      <p><b>gf can only be formed when the whole range of f fits inside the domain of g.</b></p>
      <p class="muted">g has to be able to accept every single output f could ever produce. If f can output a number g isn't defined for, the chain breaks at that point.</p>
    </div>
    <div class="card step frag" data-frag="1">
      <h3>See it break, with real numbers</h3>
      <div class="example-fn" style="margin-bottom:8px;">
        <div class="fn-pill">f(x) = x&sup2; for x &ge; 0</div>
        <div class="fn-pill">g(x) = 1 &frasl; (x &minus; 5) for x &gt; 5</div>
      </div>
      <p class="mono" style="font-size:16px;">Try x = 1: &nbsp;f(1) = 1&sup2; = 1. &nbsp;Now try g(1): is 1 &gt; 5? <b>No.</b> g(1) doesn't exist.</p>
      <p class="muted">One input sent f's output somewhere g can't follow. That's enough on its own: gf cannot be formed for this f and g. The next slide lets you drag f's domain and watch this verdict flip in real time.</p>
    </div>
    <div class="frag" data-frag="2" style="font-size:14px; color:var(--tib-secondary-color);">This exact condition shows up on real Cambridge papers, just with different letters. June 2025 Examiner Report, Paper 1, Q9(f): most candidates missed it. The ones who got it credit named exactly which range wasn't inside which domain, the same move you just made above.</div>
  </div>
`, {title:"Existence condition"});

// ---------- Slide 7: Widget - existence condition ----------
slide(`
  <div class="eyebrow">4 OF 5 &middot; SEE IT FLIP</div>
  <h2>Drag the boundary. Watch the verdict change.</h2>
  <div class="content">
    <div class="example-fn">
      <div class="fn-pill">f(x) = x&sup2; for x &ge; <span id="kVal" class="mono">3.0</span></div>
      <div class="fn-pill">g(x) = 1 &frasl; (x &minus; 5) for x &gt; 5</div>
    </div>
    <div class="widget">
      <div class="controls">
        <p style="font-size:14px; margin-bottom:6px;">Drag f's domain start, k:</p>
        <input type="range" id="kSlider" min="0" max="4" step="0.1" value="3">
        <div class="readout">k = <span id="kReadout" class="mono">3.0</span></div>
        <div class="readout">Range of f: <span id="rangeReadout" class="mono">[9.0, &infin;)</span></div>
        <div class="readout">Domain of g: <span class="mono">(5, &infin;)</span></div>
        <div class="readout" id="checkReadout">Is 9.0 &gt; 5? <b>yes</b></div>
        <div class="verdict pass" id="verdictBox">gf CAN be formed</div>
      </div>
      <svg id="widgetSvg" width="480" height="260" viewBox="0 0 480 260"></svg>
    </div>
    <div class="frag" data-frag="1" style="font-size:15px; color:var(--tib-secondary-color);">Drag k below about 2.24 (&radic;5) and the range of f dips to include numbers &le; 5, which g can't accept, and the verdict flips to red. Nothing about g changed. Only f's domain did, and that changed f's range, and that's the whole condition in one slider.</div>
  </div>
`, {title:"Widget: existence"});

// ---------- Slide 8: Worked example - real exam Q ----------
slide(`
  <div class="eyebrow">5 OF 5 &middot; REAL EXAM QUESTION</div>
  <h2>Specimen Paper 1, Question 2</h2>
  <div class="content">
    <div class="card">
      <p class="mono">f : x &#8614; 3x + 2, x &isin; &Ropf; &nbsp;&nbsp; g : x &#8614; 4x &minus; 12, x &isin; &Ropf;</p>
      <p class="muted">The full question asks you to solve f&#8315;&sup1;(x) = gf(x). Today: find gf(x), the piece you already have the tools for.</p>
    </div>
    <div class="card step">
      <div class="step-row"><span class="step-num">1</span><p>Apply f first: f is closest to x in gf(x).</p></div>
      <div class="frag" data-frag="1"><p class="mono">gf(x) = g( f(x) ) = g(3x + 2)</p></div>
    </div>
    <div class="card step frag" data-frag="2">
      <div class="step-row"><span class="step-num">2</span><p>Substitute (3x + 2) into g's rule and multiply out.</p></div>
      <div class="frag" data-frag="3"><p class="mono">= 4(3x + 2) &minus; 12 = 12x + 8 &minus; 12</p></div>
      <div class="frag math result" data-frag="4">gf(x) = <b>12x &minus; 4</b></div>
    </div>
    <div class="frag" data-frag="5" style="font-size:15px; color:var(--tib-secondary-color);">That's gf(x) done. Next: a quick preview of how f&#8315;&sup1; itself is found, so that equation isn't a black box.</div>
  </div>
`, {title:"Worked: exam Q"});

// ---------- Slide 8b: Preview - finding the inverse ----------
slide(`
  <div class="eyebrow">5 OF 5 &middot; PREVIEW</div>
  <h2>Quick preview: how f&#8315;&sup1; is found</h2>
  <div class="content">
    <div class="card">
      <p class="mono">f(x) = 3x + 2</p>
      <p class="muted">Full inverse-function theory, including when an inverse exists at all, is Session 3. Here's just the mechanic, so today's equation isn't a mystery.</p>
    </div>
    <div class="card step">
      <div class="step-row"><span class="step-num">1</span><p>Write y = f(x), then swap x and y.</p></div>
      <div class="frag" data-frag="1"><p class="mono">y = 3x + 2 &nbsp;&rarr;&nbsp; swap: &nbsp;x = 3y + 2</p></div>
    </div>
    <div class="card step frag" data-frag="2">
      <div class="step-row"><span class="step-num">2</span><p>Solve that new equation for y.</p></div>
      <div class="frag math result" data-frag="3">y = (x &minus; 2)/3, &nbsp;so <b>f&#8315;&sup1;(x) = (x &minus; 2)/3</b></div>
    </div>

// ===================== Engine =====================
const deck = document.getElementById('deck');
let current = 0;
let fragStep = 0;

function render(){
  deck.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (s.cls ? ' '+s.cls : '');
    div.id = 'slide-'+i;
    div.innerHTML = s.html;
    deck.appendChild(div);
  });
  bindPractice();
  bindWidget();
  goTo(0, true);
}

function fragsOf(slideEl){
  return Array.from(slideEl.querySelectorAll('.frag'));
}

function goTo(idx, resetFrag){
  if(idx < 0 || idx >= SLIDES.length) return;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  current = idx;
  const el = document.getElementById('slide-'+idx);
  el.classList.add('active');
  const frags = fragsOf(el);
  if(resetFrag !== false){
    fragStep = 0;
    frags.forEach(f => f.classList.remove('on'));
  }
  document.getElementById('slideCounter').textContent = (idx+1)+' / '+SLIDES.length;
  updateProgress();
  location.hash = 'slide-'+idx;
}

function updateProgress(){
  document.getElementById('progress').style.width = (((current+1)/SLIDES.length)*100)+'%';
}

function nextFrag(){
  const el = document.getElementById('slide-'+current);
  const frags = fragsOf(el);
  if(fragStep < frags.length){
    frags[fragStep].classList.add('on');
    fragStep++;
    return true;
  }
  return false;
}
function prevFrag(){
  const el = document.getElementById('slide-'+current);
  const frags = fragsOf(el);
  if(fragStep > 0){
    fragStep--;
    frags[fragStep].classList.remove('on');
    return true;
  }
  return false;
}
function revealAll(){
  const el = document.getElementById('slide-'+current);
  fragsOf(el).forEach(f => f.classList.add('on'));
  fragStep = fragsOf(el).length;
}

function bindPractice(){
  document.querySelectorAll('.practice-q').forEach(q => {
    q.addEventListener('click', () => q.classList.toggle('open'));
  });
}

// ---- Widget: existence-condition slider (slide 7) ----
function bindWidget(){
  const slider = document.getElementById('kSlider');
  if(!slider) return;
  const svg = document.getElementById('widgetSvg');
  function draw(k){
    const rangeMin = k*k;
    document.getElementById('kVal').textContent = k.toFixed(1);
    document.getElementById('kReadout').textContent = k.toFixed(1);
    document.getElementById('rangeReadout').innerHTML = '['+rangeMin.toFixed(1)+', &infin;)';
    const passes = rangeMin > 5;
    document.getElementById('checkReadout').innerHTML = 'Is '+rangeMin.toFixed(1)+' &gt; 5? <b>'+(passes?'yes':'no')+'</b>';
    const verdictBox = document.getElementById('verdictBox');
    verdictBox.textContent = passes ? 'gf CAN be formed' : 'gf CANNOT be formed';
    verdictBox.className = 'verdict ' + (passes ? 'pass' : 'fail');

    // SVG number line: 0 to 12
    const W=480,H=260, pad=40;
    const x2px = v => pad + (v/12)*(W-2*pad);
    let s = '';
    s += `<line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}" stroke="#3a3a3a" stroke-width="2"/>`;
    for(let v=0; v<=12; v+=2){
      s += `<line x1="${x2px(v)}" y1="${H/2-6}" x2="${x2px(v)}" y2="${H/2+6}" stroke="#555" stroke-width="1"/>`;
      s += `<text x="${x2px(v)}" y="${H/2+24}" font-family="JetBrains Mono" font-size="11" fill="#8a8a8a" text-anchor="middle">${v}</text>`;
    }
    // domain of g: (5, 12) open
    s += `<line x1="${x2px(5)}" y1="${H/2-30}" x2="${x2px(12)}" y2="${H/2-30}" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>`;
    s += `<text x="${x2px(5)}" y="${H/2-40}" font-family="JetBrains Mono" font-size="11" fill="#00e5ff" text-anchor="middle">domain of g &rarr;</text>`;
    // range of f: [k^2, 12]
    const rC = passes ? '#5ee6a6' : '#ff8080';
    const rStart = Math.min(rangeMin,12);
    s += `<line x1="${x2px(rStart)}" y1="${H/2+30}" x2="${x2px(12)}" y2="${H/2+30}" stroke="${rC}" stroke-width="5" stroke-linecap="round"/>`;
    s += `<circle cx="${x2px(rStart)}" cy="${H/2+30}" r="5" fill="${rC}"/>`;
    s += `<text x="${x2px(rStart)}" y="${H/2+52}" font-family="JetBrains Mono" font-size="11" fill="${rC}" text-anchor="middle">range of f</text>`;
    svg.innerHTML = s;
  }
  slider.addEventListener('input', e => draw(parseFloat(e.target.value)));
  draw(parseFloat(slider.value));
}

// ---- Keyboard ----
document.addEventListener('keydown', e => {
  if(document.getElementById('board').classList.contains('on')){
    if(e.key === 'Escape' || e.key.toLowerCase()==='w') toggleBoard();
    return;
  }
  if(document.getElementById('overview').classList.contains('on')){
    if(e.key === 'Escape' || e.key.toLowerCase()==='o') toggleOverview();
    return;
  }
  switch(e.key){
    case 'ArrowRight': if(!nextFrag()) goTo(current+1); break;
    case ' ': e.preventDefault(); if(!nextFrag()) goTo(current+1); break;
    case 'ArrowLeft': if(!prevFrag()) goTo(current-1, false); break;
    case 'r': case 'R': revealAll(); break;
    case 'o': case 'O': toggleOverview(); break;
    case 'w': case 'W': toggleBoard(); break;
    case 't': case 'T': toggleTimerReset(); break;
    case 'f': case 'F': toggleFullscreen(); break;
  }
});

// ---- Overview grid ----
function buildOverview(){
  const grid = document.getElementById('ovGrid');
  grid.innerHTML = '';
  SLIDES.forEach((s,i) => {
    const c = document.createElement('div');
    c.className = 'ov-card';
    c.innerHTML = `<div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${s.title||''}</div>`;
    c.addEventListener('click', () => { toggleOverview(); goTo(i); });
    grid.appendChild(c);
  });
}
function toggleOverview(){
  const ov = document.getElementById('overview');
  ov.classList.toggle('on');
  if(ov.classList.contains('on')) buildOverview();
}

// ---- Blank board ----
let boardCtx, drawing=false;
function toggleBoard(){
  const b = document.getElementById('board');
  b.classList.toggle('on');
  if(b.classList.contains('on')){
    const canvas = document.getElementById('boardCanvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    boardCtx = canvas.getContext('2d');
    boardCtx.strokeStyle = '#00e5ff'; boardCtx.lineWidth = 3; boardCtx.lineCap='round';
    canvas.onpointerdown = e => { drawing=true; boardCtx.beginPath(); boardCtx.moveTo(e.offsetX, e.offsetY); };
    canvas.onpointermove = e => { if(drawing){ boardCtx.lineTo(e.offsetX, e.offsetY); boardCtx.stroke(); } };
    window.onpointerup = () => drawing=false;
  }
}

// ---- Timer ----
let timerSeconds = 55*60;
let timerInterval = setInterval(() => {
  timerSeconds--;
  if(timerSeconds < 0) timerSeconds = 0;
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timer');
  el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn', timerSeconds <= 5*60);
}, 1000);
function toggleTimerReset(){ timerSeconds = 55*60; }

// ---- Fullscreen ----
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

// ---- Hash nav ----
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/slide-(\d+)/);
  if(m){ const i = parseInt(m[1]); if(i !== current) goTo(i); }
});

render();
</script>
